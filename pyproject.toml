[project]
name = "ai_learning"
version = "0.1.0"
description = "qwen-投资agent 项目（根目录统一 Python 依赖，含对话后端与 RAG）"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "huggingface_hub==1.8.0",
    "fastapi[standard]<1.0.0,>=0.115.0",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>=2.0,<3.0.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "bcrypt==4.3.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    "redis>=6.2.0",
    "loguru>=0.7.3",
    "aiomysql>=0.2.0",
    "greenlet>=3.2.3",
    "opentelemetry-api>=1.34.1",
    "opentelemetry-sdk>=1.34.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.34.1",
    "opentelemetry-instrumentation-fastapi>=0.55b1",
    "openai-agents[litellm]==0.3.1",
    "openinference-instrumentation-openai-agents>=1.2.0",
    "sse-starlette>=2.3.6",
    "json-repair>=0.50.1",
    "cn2an>=0.5.23",
    "jionlp>=1.5.25",
    "jieba==0.42.1",
    "pandas>=2.1.0",
    "setuptools>=80.9.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.9",
    "func-timeout>=4.3.5",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.1",
    # Qwen 对话 / VL（processor 依赖 torchvision，与 torch 同 CUDA 构建见下方 uv 源）
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pillow>=10.0.0",
    # RAG（rag/）与文档处理
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "elasticsearch>=8.12.0,<9",
]

# 国内 PyPI；torch/torchvision 的 CUDA 12.4 轮子走官方 cu124 索引（否则默认源常为 CPU 版 torch）
[[tool.uv.index]]
name = "tuna-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = []
